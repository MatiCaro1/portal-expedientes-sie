<header class="main-header">
  <div class="main-header__inner">
    <div class="main-header__logo-container">
      <img [src]="logoUrl" alt="Logo SIE" class="main-header__logo">
      <span class="main-header__system-name">{{ systemName }}</span>
    </div>

    <nav class="main-header__nav" aria-label="Navegación principal">
      <!-- Espacio para enlaces de navegación futuros -->
    </nav>

    <div class="main-header__actions">
      <!-- Espacio para perfil de usuario o acciones rápidas -->
    </div>
  </div>
</header>
